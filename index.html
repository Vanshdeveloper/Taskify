<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2242%22 fill=%22%23f26a36%22/><circle cx=%2250%22 cy=%2250%22 r=%2220%22 fill=%22white%22/></svg>" />
    <link rel="apple-touch-icon" href="./icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#160f0d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>Taskify</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('taskify_theme_preference');
          if (t && t !== 'espresso-terracotta') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch(e) {}
      })();
    </script>
    <style>
      :root {
        color-scheme: dark;
        background-color: #160f0d;
      }
      html, body {
        background-color: #160f0d !important;
        color-scheme: dark;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow-x: hidden;
      }
      #root {
        background-color: #160f0d !important;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body class="h-full bg-[#160f0d] text-zinc-100 antialiased selection:bg-orange-500/30 selection:text-orange-200 overflow-x-hidden">
    <div id="root" class="h-full flex flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
