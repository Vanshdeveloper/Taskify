name: Release Build & Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Sync Release Version
        id: version
        run: node scripts/sync-version.cjs

      - name: Run Test Suite
        run: npm test

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android APK
        run: |
          mkdir -p artifacts
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon || ./gradlew assembleDebug --no-daemon
          cd ..
          REL_TAG="${{ steps.version.outputs.tag }}"
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp "android/app/build/outputs/apk/release/app-release.apk" "artifacts/taskify-android-${REL_TAG}.apk"
          elif [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp "android/app/build/outputs/apk/debug/app-debug.apk" "artifacts/taskify-android-${REL_TAG}.apk"
          fi

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-android
          path: artifacts/*

  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            experimental: false
          - os: ubuntu-latest
            target: linux
            experimental: false
          - os: macos-latest
            target: mac
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Sync Release Version
        id: version
        run: node scripts/sync-version.cjs

      - name: Build Web Application
        run: npm run build

      - name: Install Electron & Builder
        run: npm install -D electron@34.0.0 electron-builder@25.1.8

      - name: Build Desktop Binaries
        run: npx electron-builder --${{ matrix.target }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-desktop-${{ matrix.target }}
          path: |
            release-desktop/*.exe
            release-desktop/*.dmg
            release-desktop/*.AppImage

  publish-release:
    name: Publish Release
    needs: [build-android, build-desktop]
    runs-on: ubuntu-latest
    if: |
      always() &&
      !cancelled() &&
      needs.build-android.result == 'success' &&
      (needs.build-desktop.result == 'success' || needs.build-desktop.result == 'cancelled')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve Release Tag
        id: meta
        run: node scripts/sync-version.cjs

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-all
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Taskify ${{ steps.meta.outputs.tag }}
          files: release-all/*
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
